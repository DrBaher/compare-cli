name: publish-mcp

on:
  push:
    tags:
      - 'mcp-v*'

# Publishes the compare-cli-mcp workspace to npm when an mcp-v* tag is pushed.
# Independent from publish.yml (which handles compare-cli on v* tags) per the
# design contract in docs/mcp.md §1.3: the two packages version independently.

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm ci
      - name: run mcp tests
        working-directory: mcp
        run: node --test tests/test_*.mjs
      - name: verify mcp/package.json version matches tag
        run: |
          tag="${GITHUB_REF#refs/tags/mcp-v}"
          pkg=$(node -p "require('./mcp/package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag mcp-v$tag does not match mcp/package.json version $pkg"
            exit 1
          fi
      - name: publish compare-cli-mcp
        working-directory: mcp
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-mcp-registry:
    # Publish mcp/server.json to the official MCP Registry (GitHub OIDC proves
    # io.github.DrBaher ownership — no secrets). After the npm publish, since the
    # registry validates the published npm tarball's mcpName.
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Install mcp-publisher
        working-directory: mcp
        run: curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Login to MCP Registry (GitHub OIDC)
        working-directory: mcp
        run: ./mcp-publisher login github-oidc
      - name: Publish server.json
        working-directory: mcp
        run: ./mcp-publisher publish
