name: publish-mcp

on:
  push:
    tags:
      - 'mcp-v*'

# Publishes the compare-cli-mcp workspace to npm when an mcp-v* tag is pushed.
# Independent from publish.yml (which handles compare-cli on v* tags) per the
# design contract in docs/mcp.md §1.3: the two packages version independently.

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm ci
      - name: run mcp tests
        working-directory: mcp
        run: node --test tests/test_*.mjs
      - name: verify mcp/package.json version matches tag
        run: |
          tag="${GITHUB_REF#refs/tags/mcp-v}"
          pkg=$(node -p "require('./mcp/package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag mcp-v$tag does not match mcp/package.json version $pkg"
            exit 1
          fi
      - name: publish compare-cli-mcp
        working-directory: mcp
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
