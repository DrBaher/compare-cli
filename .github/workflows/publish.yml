name: publish

on:
  push:
    tags:
      - 'v*'

# Uses npm Trusted Publishing via OIDC. One-time setup at:
#   https://www.npmjs.com/settings/<account>/trusted-publishers
# Configure: repo = DrBaher/compare-cli, workflow = publish.yml, environment = npm
# Once configured, no npm token is needed in repo secrets.
#
# Note (sibling-suite alignment): draft-cli's publish.yml currently uses a
# bootstrap NPM_TOKEN fallback while OIDC + setup-node@v6 placeholder
# interaction is under investigation. compare-cli ships with the same
# fallback shape so the two repos behave identically. When the upstream
# issue resolves, both can switch back to pure OIDC in one line.

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          # Node 22 needed for npm CLI 11.5.1+, the minimum for Trusted
          # Publishing OIDC. Node 20 ships with npm 10.x which falls back to
          # setup-node@v6's NODE_AUTH_TOKEN placeholder when no real token
          # is set.
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: verify version matches tag
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi
      - run: npm publish --provenance --access public
        env:
          # NPM_TOKEN fallback restored after pure-OIDC publish failed on
          # the first attempt for draft-cli. See draft-cli CHANGELOG 0.3.2
          # for the analysis. Trusted Publisher stays configured on npm so
          # the switch back to OIDC is a one-line change once the upstream
          # cause is understood.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
